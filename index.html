<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#f5f0e7"
    >

    <title>Pilar ♥ Sofía</title>

    <!-- Preconecta con Apps Script cuanto antes,
         antes de que custom.js siquiera se descargue -->
    <link
        rel="preconnect"
        href="https://script.google.com"
    >
    <link
        rel="dns-prefetch"
        href="https://script.google.com"
    >

    <!-- Nuestro CSS -->
    <link
        rel="stylesheet"
        href="css/custom.css"
    >

</head>


<body>

    <!--
        Toda la aplicación de la invitación
        se construirá aquí mediante JavaScript.
    -->
    <main id="app"></main>


    <!--
        Nuestra lógica principal:
        - obtiene el ID del invitado
        - consulta Apps Script
        - crea el sobre
        - crea la web
    -->
    <script
        src="js/custom.js"
    ></script>


 

</body>

</html>
